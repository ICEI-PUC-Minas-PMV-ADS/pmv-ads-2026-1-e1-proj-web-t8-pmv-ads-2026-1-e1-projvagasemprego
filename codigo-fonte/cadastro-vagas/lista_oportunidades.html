<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UaiTrampo - Oportunidades</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="oportunidade.css">
    <link rel="icon" type="image/png" href="../../documentos/img/logo.png">
</head>

<body>
    <nav class="navbar-uai">
        <a class="navbar-brand-uai" href="lista_oportunidades.html">
            <img src="../../documentos/img/logo.png" alt="" style="width: 50px;">
            <span><span class="brand-uai">Uai</span><span class="brand-trampo">Trampo</span></span>
        </a>
        <div class="navbar-nav-uai">
            <a class="btn-nav-blue" href="#">Empresas</a>
            <a class="btn-nav-outline" href="#">Candidatos</a>
            <a class="btn-nav-green" href="#">Cadastre-se</a>
            <a class="btn-nav-outline" href="index.html">Gerenciar Vagas</a>
        </div>
    </nav>

    <section class="hero">
        <h2>Encontre a vaga ideal para você</h2>
        <div class="search-bar">
            <input type="text" id="filtro_titulo" placeholder="Cargo, empresa ou palavra-chave..."
                oninput="listaOportunidades()">
            <input type="text" id="filtro_cidade" placeholder="Cidade ou estado..." oninput="listaOportunidades()"
                style="border-right:none;">
            <button class="btn-buscar" onclick="listaOportunidades()">Buscar</button>
        </div>
    </section>

    <div class="filtros-bar">
        <label>Filtrar por:</label>
        <select id="filtro_area" onchange="listaOportunidades()">
            <option value="">Todas as Áreas</option>
            <option value="tecnologia">Tecnologia</option>
            <option value="marketing">Marketing</option>
            <option value="rh">Recursos Humanos</option>
            <option value="financeiro">Financeiro</option>
            <option value="administrativo">Administrativo</option>
            <option value="vendas">Vendas</option>
        </select>
        <select id="filtro_tipo" onchange="listaOportunidades()">
            <option value="">Todos os Tipos</option>
            <option value="CLT">CLT</option>
            <option value="PJ">PJ</option>
            <option value="Estágio">Estágio</option>
            <option value="Freelancer">Freelancer</option>
        </select>
    </div>

    <div class="content-area">
        <div class="results-header">
            <h4 id="total-vagas">Carregando vagas...</h4>
            <a href="index.html" class="btn-cadastrar">+ Cadastrar Vaga</a>
        </div>
        <div class="cards-grid" id="cards-oportunidades">
        </div>
    </div>

    <footer>© 2026 UaiTrampo. Todos os direitos reservados.</footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js"></script>
    <script src="app.js"></script>
    <script>
        function listaOportunidades() {
            let oportunidades = db.oportunidades

            let filtroTitulo = document.getElementById('filtro_titulo').value.toLowerCase()
            let filtroCidade = document.getElementById('filtro_cidade').value.toLowerCase()
            let filtroArea = document.getElementById('filtro_area').value
            let filtroTipo = document.getElementById('filtro_tipo').value

            let resultado = oportunidades.filter(op => {
                let bateTitulo = filtroTitulo === '' || op.titulo.toLowerCase().includes(filtroTitulo) || op.empresa.toLowerCase().includes(filtroTitulo)
                let bateCidade = filtroCidade === '' || op.cidade.toLowerCase().includes(filtroCidade)
                let bateArea = filtroArea === '' || op.area === filtroArea
                let bateTipo = filtroTipo === '' || op.tipo === filtroTipo
                return bateTitulo && bateCidade && bateArea && bateTipo
            })

            let total = resultado.length
            $("#total-vagas").text(total + (total === 1 ? ' vaga encontrada' : ' vagas encontradas'))
            $("#cards-oportunidades").empty()

            if (total === 0) {
                $("#cards-oportunidades").append('<p class="sem-resultados">Nenhuma vaga encontrada para os filtros selecionados.</p>')
                return
            }

            resultado.forEach(op => {
                let dataFormatada = op.data_encerramento ? 'Encerra em ' + op.data_encerramento : ''
                $("#cards-oportunidades").append(`
                    <div class="vaga-card">
                        <h5>${op.titulo}</h5>
                        <div class="empresa">🏢 ${op.empresa} — ${op.cidade}</div>
                        <div class="descricao">${op.descricao}</div>
                        <div class="badges">
                            <span class="badge-tipo">${op.tipo}</span>
                            <span class="badge-area">${op.area}</span>
                        </div>
                        <div class="rodape">
                            <span class="salario">${op.salario || 'Salário a combinar'}</span>
                            <span>${dataFormatada}</span>
                        </div>
                    </div>`)
            })
        }

        window.onload = () => listaOportunidades()
    </script>
</body>

</html>
