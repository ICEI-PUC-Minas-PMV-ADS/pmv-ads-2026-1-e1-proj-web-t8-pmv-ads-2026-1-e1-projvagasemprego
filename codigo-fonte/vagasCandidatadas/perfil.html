<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - UaiTrampo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="../../documentos/img/logo.png">
</head>

<body>
    <nav class="navbar-uai">
        <a class="navbar-brand-uai" href="../cadastro-vagas/lista_oportunidades.html">
            <img src="../../documentos/img/logo.png" alt="" style="width: 50px;">
            <span><span class="brand-uai">Uai</span><span class="brand-trampo">Trampo</span></span>
        </a>

        <div class="navbar-nav-uai"></div>

        <div class="menu-container">
            <div class="hamburguer-icon" onclick="toggleMenu(event)">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="menu-balao" id="menuBalao">
                <a href="perfil.html">Meu Perfil</a>
                <a href="index.html">Minhas Candidaturas</a>
                <a href="configuracoes.html">Configurações</a>
                <div class="divisor"></div>
                <a href="../login/index.html" style="color: #d41a1a;" onclick="logout()">Sair da Conta</a>
            </div>
        </div>
    </nav>

    <div class="content-area">
        <div class="results-header">
            <h4>Meu Perfil</h4>
            <a href="index.html" class="btn-nav-outline">Voltar</a>
        </div>

        <div class="perfil-box">
            <h2>Atualize seus dados</h2>
            <form id="perfil-form" class="perfil-form">
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input id="nome" type="text" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" required>
                </div>
                <div class="form-group">
                    <label for="tipoConta">Tipo de conta</label>
                    <input id="tipoConta" type="text" readonly>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-nav-green">Salvar Alterações</button>
                </div>
                <div id="perfil-mensagem" class="form-message" style="display:none;"></div>
            </form>
        </div>
    </div>

    <footer>© 2026 UaiTrampo. Todos os direitos reservados.</footer>

    <script src="perfil.js"></script>
</body>

</html>
