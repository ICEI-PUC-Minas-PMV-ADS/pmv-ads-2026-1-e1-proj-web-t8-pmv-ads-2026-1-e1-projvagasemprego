<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UaiTrampo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="contain">
            <div class="baner">
            
                <div class="banerInfos">
                    <img src="../../documentos/img/briefcase.png" alt="">
                    <h1>Encontre sua próxima oportunidade</h1>
                    <p>Gerencie candidaturas, vagas e talentos em um só lugar.          </p>
                </div>
            </div>
            <div class="login">
                <div class="loginInfos">
                    <h1>Bem vindo de volta!</h1>
                    <p>Faça login para acessar sua conta</p>
                    <form action="" id="login-form"> 
                        <div class="input-wrapper">
                            <label for="">Email</label>
                            <input type="email" name="" id="" placeholder="Seu@mail.com">
                        </div>
                        <div class="input-wrapper">
                            <label for="">Senha</label>
                            <input type="password" name="" id="" placeholder="*****">
                        </div>

                        <div class="forgot-pass">
                            <a href="#">Esqueceu a senha?</a>
                        </div>
                        <button>Entrar</button>
                        <div class="form-footer">
                            Não tem conta? <a href="#">Cadastre-se</a>
                        </div>
                    </form>


                </div>

            </div>
        </div>          
    </div>

</body>
</html>
